<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas ricas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
   
     <header>
       <div id="cabecera-principal">
        <section class="rica-comida">
        <h1 class="titulo">Bienvenidos al lugar de ricas comidas</h1>
        <img src="imagenes/delicioso menu.jpg" alt="menus del dia">
        <p>Los mejores comidas estan aqui mismo</p>
       </section>
       </div>
    </header>
   

    <main>
        <div id="lo-principal">
            <section class="rica-sopa">
            <h2 class="titulo">sopas caseras</h2>
            <img src="imagenes/deliciosa sopa.jpg" alt="deliciosa sopa casera">
            <p>Con lo mejor tiene pollo tiene papas tiene todo tiene yuca</p>
            </section>
        </div>
        
    </main>

    <footer>    
        <div id="la-bandeja">
            <section class="arros-pollo-papas">
            <h3 class="titulo">Papas con pollo</h3>
            <img src="imagenes/Delicioso arroz con pollo y papas.jpg" alt="delicioso arros con pollo y papas">
            <p>Esto tieno el delicioso arros y el pollo y las papas con limonada</p>
            </section>
        </div>
    </footer>

</body>
</html>
